---
name: Build and Test

"on":
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

jobs:
  discover:
    name: Discover packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Find testable packages
        id: find
        run: |
          packages=$(find packages -name pubspec.yaml -mindepth 2 -maxdepth 2 \
            -exec dirname {} \; | sort | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Found packages: $packages"

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable
          cache: true

      - run: dart format --set-exit-if-changed .

  analyze:
    name: Analyze (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable
          cache: true

      - name: Install dependencies (workspace)
        run: flutter pub get

      - name: Analyze ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: flutter analyze

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable
          cache: true

      - name: Install dependencies (workspace)
        run: flutter pub get

      - name: Check for tests
        id: has_tests
        working-directory: ${{ matrix.package }}
        run: |
          if [ -d "test" ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No tests found in ${{ matrix.package }}, skipping."
          fi

      - name: Test ${{ matrix.package }}
        if: steps.has_tests.outputs.run == 'true'
        working-directory: ${{ matrix.package }}
        run: flutter test

  build-example:
    name: Build example (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable
          cache: true

      - run: flutter config --enable-web
      - run: flutter pub get

      - name: Build web (WASM)
        working-directory: example
        run: flutter build web --wasm --release
